<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation Skill Tree</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #060913;
      --panel-bg: rgba(13, 19, 36, 0.75);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #00f3ff;
      --accent-gold: #ffb700;
      --accent-danger: #ff4757;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    #skill-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    #skill-canvas:active {
      cursor: grabbing;
    }

    /* Top HUD Bar */
    #header {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
      gap: 16px;
    }

    #header > * {
      pointer-events: auto;
    }

    /* Stats HUD */
    .stats-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      padding: 10px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .level-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 6px 12px;
      border-radius: 10px;
    }

    .level-badge .label {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent-cyan);
    }

    .level-badge .value {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .xp-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 120px;
    }

    .xp-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .xp-title { color: var(--text-muted); }
    .xp-value { color: var(--accent-gold); }

    .xp-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffb700, #ffe17d);
      border-radius: 3px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Central Command: Search & Categories */
    .command-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      padding: 8px 12px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 460px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    #search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 36px;
      border-radius: 10px;
      outline: none;
      font-size: 0.85rem;
      font-family: var(--font-family);
      transition: all 0.2s ease;
    }

    #search-input:focus {
      border-color: var(--accent-cyan);
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    #search-input:focus ~ .search-icon {
      color: var(--accent-cyan);
    }

    .search-kbd {
      position: absolute;
      right: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-family: monospace;
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
    }

    .clear-btn:hover { color: #fff; }
    .clear-btn.hidden { display: none; }

    /* Filter Pills */
    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 2px;
    }

    .filter-pills::-webkit-scrollbar { display: none; }

    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .pill:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .pill.active {
      background: rgba(0, 243, 255, 0.15);
      color: var(--accent-cyan);
      border-color: rgba(0, 243, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ccc;
    }
    .dot.fitness { background: #ff4757; }
    .dot.craft { background: #2ed573; }
    .dot.mindset { background: #1e90ff; }
    .dot.art { background: #ffa502; }
    .dot.habits { background: #9b59b6; }
    .dot.hybrid { background: var(--accent-gold); }

    /* Reset Button */
    .reset-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 71, 87, 0.12);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: var(--accent-danger);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background: rgba(255, 71, 87, 0.25);
      border-color: var(--accent-danger);
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
      transform: translateY(-1px);
    }

    /* Node Inspector Panel */
    .inspector-card {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 22px;
      z-index: 10;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .inspector-card.hidden {
      transform: translateY(20px) scale(0.96);
      opacity: 0;
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .close-btn:hover { color: #fff; }

    .category-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid rgba(0, 243, 255, 0.2);
    }

    #node-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    #node-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .unlock-status {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-indicator {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-cyan);
      transition: width 0.3s ease;
    }

    .cta-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-cyan);
      border: none;
      border-radius: 10px;
      color: #060913;
      font-size: 0.85rem;
      font-weight: 800;
      font-family: var(--font-family);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
    }

    .cta-btn:hover:not(:disabled) {
      background: #33f6ff;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
      transform: translateY(-1px);
    }

    .cta-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.4);
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- HUD Header Overlay -->
  <header id="header">
    
    <!-- User Stats Card -->
    <div class="stats-card">
      <div class="level-badge">
        <span class="label">LEVEL</span>
        <span id="level-display" class="value">1</span>
      </div>
      <div class="xp-container">
        <div class="xp-header">
          <span class="xp-title">EXPERIENCE</span>
          <span class="xp-value" id="xp-display">0 / 100 XP</span>
        </div>
        <div class="xp-bar-bg">
          <div id="xp-bar-fill" class="xp-bar-fill" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Command Center Overlay -->
    <div class="command-bar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search skills or keywords..." autocomplete="off">
        <button id="clear-search" class="clear-btn hidden">&times;</button>
        <kbd class="search-kbd">/</kbd>
      </div>

      <div class="filter-pills">
        <button class="pill active" data-category="ALL">All Nodes</button>
        <button class="pill" data-category="Fitness"><span class="dot fitness"></span>Fitness</button>
        <button class="pill" data-category="Craft"><span class="dot craft"></span>Craft</button>
        <button class="pill" data-category="Mindset"><span class="dot mindset"></span>Mindset</button>
        <button class="pill" data-category="Art"><span class="dot art"></span>Art</button>
        <button class="pill" data-category="Habits"><span class="dot habits"></span>Habits</button>
        <button class="pill" data-category="Hybrid"><span class="dot hybrid"></span>Hybrid</button>
      </div>
    </div>

    <!-- Reset Progress Button -->
    <button id="reset-btn" class="reset-btn" title="Reset Tree Progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
      Reset
    </button>
  </header>

  <!-- Interactive Canvas -->
  <canvas id="skill-canvas"></canvas>

  <!-- Node Inspector Drawer Panel -->
  <aside id="inspector" class="inspector-card hidden">
    <button id="close-inspector" class="close-btn">&times;</button>
    <div class="inspector-header">
      <span id="node-category" class="category-tag">Category</span>
      <h2 id="node-title">Node Title</h2>
    </div>
    <p id="node-desc">Node description will appear here when clicked.</p>
    
    <div class="unlock-status">
      <div class="status-indicator">
        <div id="node-progress" class="progress-fill"></div>
      </div>
      <button id="unlock-btn" class="cta-btn">Unlock Skill (+25 XP)</button>
    </div>
  </aside>

  <script>
    const canvas = document.getElementById('skill-canvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const inspector = document.getElementById('inspector');
    const closeInspector = document.getElementById('close-inspector');
    const nodeTitle = document.getElementById('node-title');
    const nodeCategory = document.getElementById('node-category');
    const nodeDesc = document.getElementById('node-desc');
    const unlockBtn = document.getElementById('unlock-btn');
    const nodeProgress = document.getElementById('node-progress');
    const levelDisplay = document.getElementById('level-display');
    const xpDisplay = document.getElementById('xp-display');
    const xpBarFill = document.getElementById('xp-bar-fill');
    const resetBtn = document.getElementById('reset-btn');

    // Search & Filter Elements
    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search');
    const searchKbd = document.querySelector('.search-kbd');
    const filterPills = document.querySelectorAll('.pill');

    const STORAGE_KEY = 'constellation_skill_tree_save';

    const defaultState = {
      xp: 0,
      level: 1,
      unlockedNodes: ['core']
    };

    let userState = loadState();
    let searchQuery = '';
    let activeCategory = 'ALL';

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return {
            xp: typeof parsed.xp === 'number' ? parsed.xp : defaultState.xp,
            level: typeof parsed.level === 'number' ? parsed.level : defaultState.level,
            unlockedNodes: Array.isArray(parsed.unlockedNodes) ? parsed.unlockedNodes : defaultState.unlockedNodes
          };
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
      return { ...defaultState };
    }

    // Camera State
    let camera = { x: 0, y: 0, zoom: 1 };
    let isDragging = false;
    let startPan = { x: 0, y: 0 };
    let dragDistance = 0;
    let selectedNode = null;

    // Background Starfield Particles
    const particles = [];
    const PARTICLE_COUNT = 140;

    function initParticles() {
      particles.length = 0;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: (Math.random() - 0.5) * 3200,
          y: (Math.random() - 0.5) * 3200,
          size: Math.random() * 1.6 + 0.4,
          alpha: Math.random() * 0.7 + 0.2,
          pulseSpeed: Math.random() * 0.02 + 0.005
        });
      }
    }

    // Skill Tree Nodes
    const nodes = [
      { id: 'core', name: 'Origin Star', category: 'Core', desc: 'The starting center of your sky.', radius: 0, angle: 0, magnitude: 18 },

      // Ring 1
      { id: 'fit_1', name: 'Physical Vitality', category: 'Fitness', desc: 'Daily movement foundation.', radius: 140, angle: 0, magnitude: 14 },
      { id: 'code_1', name: 'Logic & Code', category: 'Craft', desc: 'Programming core.', radius: 140, angle: 72, magnitude: 14 },
      { id: 'mind_1', name: 'Mental Clarity', category: 'Mindset', desc: 'Mindfulness & focus.', radius: 140, angle: 144, magnitude: 14 },
      { id: 'art_1', name: 'Creative Flow', category: 'Art', desc: 'Design & expression.', radius: 140, angle: 216, magnitude: 14 },
      { id: 'life_1', name: 'Life Balance', category: 'Habits', desc: 'Routines & recovery.', radius: 140, angle: 288, magnitude: 14 },

      // Ring 2
      { id: 'fit_2a', name: 'Strength Training', category: 'Fitness', desc: 'Resistance work.', radius: 240, angle: -15, magnitude: 11 },
      { id: 'fit_2b', name: 'Cardio Engine', category: 'Fitness', desc: 'Stamina building.', radius: 270, angle: 15, magnitude: 10 },

      { id: 'code_2a', name: 'System Arch', category: 'Craft', desc: 'Backend systems.', radius: 250, angle: 57, magnitude: 11 },
      { id: 'code_2b', name: 'Frontend Canvas', category: 'Craft', desc: 'UI & web canvas.', radius: 280, angle: 87, magnitude: 10 },

      { id: 'mind_2a', name: 'Deep Focus', category: 'Mindset', desc: 'Flow state focus.', radius: 240, angle: 129, magnitude: 11 },
      { id: 'mind_2b', name: 'Emotional Control', category: 'Mindset', desc: 'Stoic stability.', radius: 275, angle: 159, magnitude: 10 },

      { id: 'art_2a', name: 'Design Systems', category: 'Art', desc: 'Color & typography.', radius: 250, angle: 201, magnitude: 11 },
      { id: 'art_2b', name: 'Storytelling', category: 'Art', desc: 'Narrative structure.', radius: 280, angle: 231, magnitude: 10 },

      { id: 'life_2a', name: 'Sleep Mastery', category: 'Habits', desc: 'Sleep environment.', radius: 240, angle: 273, magnitude: 11 },
      { id: 'life_2b', name: 'Time Boxing', category: 'Habits', desc: 'Structured blocks.', radius: 275, angle: 303, magnitude: 10 },

      // Hybrids
      { id: 'hyb_game_dev', name: 'Game Design', category: 'Hybrid', desc: 'Requires Code AND Focus.', radius: 340, angle: 108, magnitude: 12 },
      { id: 'hyb_biohack', name: 'Biohacking', category: 'Hybrid', desc: 'Requires Fitness AND Sleep Mastery.', radius: 340, angle: -45, magnitude: 12 }
    ];

    const connections = [
      { from: 'core', to: 'fit_1' },
      { from: 'core', to: 'code_1' },
      { from: 'core', to: 'mind_1' },
      { from: 'core', to: 'art_1' },
      { from: 'core', to: 'life_1' },

      { from: 'fit_1', to: 'fit_2a' },
      { from: 'fit_1', to: 'fit_2b' },
      { from: 'code_1', to: 'code_2a' },
      { from: 'code_1', to: 'code_2b' },
      { from: 'mind_1', to: 'mind_2a' },
      { from: 'mind_1', to: 'mind_2b' },
      { from: 'art_1', to: 'art_2a' },
      { from: 'art_1', to: 'art_2b' },
      { from: 'life_1', to: 'life_2a' },
      { from: 'life_1', to: 'life_2b' },

      { from: 'code_2b', to: 'hyb_game_dev' },
      { from: 'mind_2a', to: 'hyb_game_dev' },
      { from: 'fit_2a', to: 'hyb_biohack' },
      { from: 'life_2b', to: 'hyb_biohack' }
    ];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function getNodePosition(node) {
      const rad = (node.angle * Math.PI) / 180;
      return {
        x: node.radius * Math.cos(rad),
        y: node.radius * Math.sin(rad)
      };
    }

    function isNodeMatchingSearch(node) {
      const matchesCategory = activeCategory === 'ALL' || node.category.toLowerCase() === activeCategory.toLowerCase();
      const matchesSearch = !searchQuery || node.name.toLowerCase().includes(searchQuery) || node.category.toLowerCase().includes(searchQuery);
      return matchesCategory && matchesSearch;
    }

    function updateUI() {
      levelDisplay.innerText = userState.level;
      xpDisplay.innerText = `${userState.xp} / 100 XP`;
      xpBarFill.style.width = `${userState.xp}%`;
    }

    // Main Canvas Render Loop
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(canvas.width / 2 + camera.x, canvas.height / 2 + camera.y);
      ctx.scale(camera.zoom, camera.zoom);

      // 1. Particle Starfield
      particles.forEach(p => {
        p.alpha += Math.sin(Date.now() * 0.001 + p.x) * p.pulseSpeed * 0.05;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(0.7, p.alpha))})`;
        ctx.fill();
      });

      // 2. Lines / Connections
      connections.forEach(conn => {
        const parent = nodes.find(n => n.id === conn.from);
        const child = nodes.find(n => n.id === conn.to);
        
        if (parent && child) {
          const pPos = getNodePosition(parent);
          const cPos = getNodePosition(child);

          const isConnectedUnlocked = userState.unlockedNodes.includes(parent.id) && userState.unlockedNodes.includes(child.id);
          const isFilteredOut = !isNodeMatchingSearch(parent) && !isNodeMatchingSearch(child);

          ctx.beginPath();
          ctx.moveTo(pPos.x, pPos.y);
          ctx.lineTo(cPos.x, cPos.y);

          if (isFilteredOut) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
          } else {
            ctx.strokeStyle = isConnectedUnlocked ? '#00f3ff' : 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = isConnectedUnlocked ? 2 : 1;
          }
          ctx.stroke();
        }
      });

      // 3. Skill Nodes
      nodes.forEach(node => {
        const pos = getNodePosition(node);
        const isSelected = selectedNode && selectedNode.id === node.id;
        const isUnlocked = userState.unlockedNodes.includes(node.id);
        const matchesFilter = isNodeMatchingSearch(node);

        const radius = node.magnitude || 10;

        ctx.beginPath();
        ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);

        if (matchesFilter) {
          if (isUnlocked) {
            ctx.fillStyle = node.category === 'Hybrid' ? '#ffb700' : '#00f3ff';
            ctx.shadowBlur = isSelected ? 22 : 12;
            ctx.shadowColor = ctx.fillStyle;
          } else {
            ctx.fillStyle = '#0f172a';
            ctx.shadowBlur = 0;
          }
          ctx.lineWidth = isSelected ? 3 : 1.5;
          ctx.strokeStyle = isSelected ? '#ffffff' : (isUnlocked ? '#ffffff' : '#334155');
        } else {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
          ctx.lineWidth = 1;
          ctx.shadowBlur = 0;
        }

        ctx.fill();
        ctx.stroke();

        // Node Title Text
        ctx.shadowBlur = 0;
        if (matchesFilter) {
          ctx.fillStyle = isUnlocked ? '#ffffff' : 'rgba(255, 255, 255, 0.55)';
        } else {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        }
        ctx.font = '600 11px "Plus Jakarta Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(node.name, pos.x, pos.y + radius + 15);
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    // Pan and Zoom Listeners
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragDistance = 0;
      startPan = { x: e.clientX - camera.x, y: e.clientY - camera.y };
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        dragDistance += Math.abs(e.movementX) + Math.abs(e.movementY);
        camera.x = e.clientX - startPan.x;
        camera.y = e.clientY - startPan.y;
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.1;
      if (e.deltaY < 0) {
        camera.zoom = Math.min(camera.zoom * zoomFactor, 2.5);
      } else {
        camera.zoom = Math.max(camera.zoom / zoomFactor, 0.4);
      }
    }, { passive: false });

    canvas.addEventListener('click', (e) => {
      if (dragDistance > 5) return;

      const rect = canvas.getBoundingClientRect();
      const mouseX = (e.clientX - rect.left - canvas.width / 2 - camera.x) / camera.zoom;
      const mouseY = (e.clientY - rect.top - canvas.height / 2 - camera.y) / camera.zoom;

      let clickedNode = null;

      nodes.forEach(node => {
        const pos = getNodePosition(node);
        const dist = Math.hypot(mouseX - pos.x, mouseY - pos.y);
        if (dist < (node.magnitude || 12) + 6) {
          clickedNode = node;
        }
      });

      if (clickedNode) {
        selectedNode = clickedNode;
        openInspectorPanel(clickedNode);
      } else {
        selectedNode = null;
        inspector.classList.add('hidden');
      }
    });

    // Search and Filter Handlers
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      if (searchQuery.length > 0) {
        clearSearchBtn.classList.remove('hidden');
        searchKbd.classList.add('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
        searchKbd.classList.remove('hidden');
      }
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      searchKbd.classList.remove('hidden');
      searchInput.focus();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        filterPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        activeCategory = pill.getAttribute('data-category');
      });
    });

    function openInspectorPanel(node) {
      nodeTitle.innerText = node.name;
      nodeCategory.innerText = node.category;
      nodeDesc.innerText = node.desc;
      
      const isUnlocked = userState.unlockedNodes.includes(node.id);
      
      if (isUnlocked) {
        unlockBtn.innerText = 'Unlocked';
        unlockBtn.disabled = true;
        nodeProgress.style.width = '100%';
      } else {
        unlockBtn.innerText = 'Unlock Skill (+25 XP)';
        unlockBtn.disabled = false;
        nodeProgress.style.width = '0%';
      }
      
      inspector.classList.remove('hidden');
    }

    closeInspector.addEventListener('click', () => {
      inspector.classList.add('hidden');
      selectedNode = null;
    });

    unlockBtn.addEventListener('click', () => {
      if (!selectedNode) return;

      const parentConnections = connections.filter(c => c.to === selectedNode.id);
      const allParentsUnlocked = parentConnections.every(conn => userState.unlockedNodes.includes(conn.from));

      if (!allParentsUnlocked) {
        alert('Unlock the prerequisite skills first!');
        return;
      }

      if (!userState.unlockedNodes.includes(selectedNode.id)) {
        userState.unlockedNodes.push(selectedNode.id);
        addXP(25);
        saveState();
        openInspectorPanel(selectedNode);
      }
    });

    function addXP(amount) {
      userState.xp += amount;
      if (userState.xp >= 100) {
        userState.level += Math.floor(userState.xp / 100);
        userState.xp = userState.xp % 100;
      }
      updateUI();
      saveState();
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to reset all skill tree progress?')) {
          localStorage.removeItem(STORAGE_KEY);
          userState = { ...defaultState };
          selectedNode = null;
          inspector.classList.add('hidden');
          updateUI();
        }
      });
    }

    // Initialize
    initParticles();
    updateUI();
    resizeCanvas();
    requestAnimationFrame(render);
  </script>
</body>
</html>
