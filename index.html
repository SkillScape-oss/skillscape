<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, inital-scale-1.0"/>
    <title>HyperAcheive</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hud">
      <div class="level-badge">
        <span class="hud-label">LEVEL</span>
        <span id="level-display" class="hud-value">1</span>
      </div>

      <div class="sp-badge">
        <span class="hud-label">SKILL POINTS</span>
        <span id="sp-display" class="hud-value">1</span>
      </div>

      <div class="xp-container">
        <div class="xp-header">
          <span id="xp-display" class="xp-vlaue">0 / 100 XP</span>
        </div>
        <div class="xp-bar-bg">
          <div id="xp-bar-fill" class="xp-bar-fill"></div>
        </div>
      </div>
    </header>

    <main class="map-container" id="map-container">
      <canvas id="starfield-canvas"></canvas>
      <div class="map-world" id="map-world">
        <svg class="connections-svg" id="svg-layer"></svg>
        <div class="nodes-layer" id="nodes-layer"></div>
      </div>  
    </main>
    <script src="script.js"></script>
  </body>
</html>
